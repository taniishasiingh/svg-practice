<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="A pelican riding a bicycle along a sunny country road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8ee"/>
      <stop offset="100%" stop-color="#dff4fb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ed36f"/>
      <stop offset="100%" stop-color="#63b455"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e7ea"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfdfe"/>
      <stop offset="100%" stop-color="#d5dade"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc46b"/>
      <stop offset="60%" stop-color="#f9a03f"/>
      <stop offset="100%" stop-color="#ef8a20"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="100%" stop-color="#f0801f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2453c"/>
      <stop offset="100%" stop-color="#a5211c"/>
    </linearGradient>

    <g id="wheel">
      <circle r="58" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="50" fill="none" stroke="#b6b6b6" stroke-width="2"/>
      <g stroke="#b0b0b0" stroke-width="2" stroke-linecap="round">
        <line x1="-50" y1="0" x2="50" y2="0"/>
        <line x1="0" y1="-50" x2="0" y2="50"/>
        <line x1="-35.4" y1="-35.4" x2="35.4" y2="35.4"/>
        <line x1="-35.4" y1="35.4" x2="35.4" y2="-35.4"/>
      </g>
      <circle r="9.5" fill="#2b2b2b"/>
      <circle r="3.5" fill="#cfcfcf"/>
    </g>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="52" ry="24"/>
      <ellipse cx="34" cy="-10" rx="40" ry="20"/>
      <ellipse cx="-30" cy="-8" rx="34" ry="18"/>
      <ellipse cx="4" cy="-18" rx="30" ry="16"/>
    </g>

    <g id="foot">
      <path d="M 0 0 q -19 -3 -22 4 q 12 6 22 2 q 10 4 22 -2 q -3 -7 -22 -4 Z"
            stroke="#c96a10" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ===== Sky ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <circle cx="672" cy="96" r="46" fill="#ffd34d" opacity="0.95"/>
  <g stroke="#ffd34d" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="672" y1="26" x2="672" y2="12"/>
    <line x1="672" y1="166" x2="672" y2="180"/>
    <line x1="602" y1="96" x2="588" y2="96"/>
    <line x1="742" y1="96" x2="756" y2="96"/>
    <line x1="623" y1="47" x2="613" y2="37"/>
    <line x1="721" y1="145" x2="731" y2="155"/>
    <line x1="721" y1="47" x2="731" y2="37"/>
    <line x1="623" y1="145" x2="613" y2="155"/>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <use xlink:href="#cloud" href="#cloud" transform="translate(140 96)"/>
    <use xlink:href="#cloud" href="#cloud" transform="translate(500 76) scale(0.8)"/>
    <use xlink:href="#cloud" href="#cloud" transform="translate(310 158) scale(0.5)" opacity="0.75"/>
  </g>

  <g fill="none" stroke="#5b7f96" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M 560 200 q 9 -9 18 0 q 9 -9 18 0"/>
    <path d="M 610 224 q 7 -7 14 0 q 7 -7 14 0"/>
  </g>

  <!-- ===== Land ===== -->
  <rect y="428" width="800" height="172" fill="url(#grass)"/>
  <path d="M 0 428 q 100 -22 200 -4 q 110 20 210 -6 q 120 -30 210 -6 q 90 22 180 6 v 14 H 0 Z"
        fill="#a2dd83" opacity="0.7"/>

  <rect y="468" width="800" height="132" fill="#575757"/>
  <rect y="468" width="800" height="7" fill="#6d6d6d"/>
  <line x1="0" y1="516" x2="800" y2="516" stroke="#f4f4f4" stroke-width="5"
        stroke-dasharray="34 26" opacity="0.85"/>

  <g stroke="#4f9d43" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 40 468 q 2 -14 8 -20"/>
    <path d="M 50 468 q 6 -14 14 -18"/>
    <path d="M 700 468 q 2 -14 8 -20"/>
    <path d="M 712 468 q 7 -13 15 -16"/>
    <path d="M 90 468 q 3 -12 9 -17"/>
  </g>

  <!-- ===== Speed lines ===== -->
  <g stroke="#8aa0ad" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <line x1="30" y1="300" x2="140" y2="300"/>
    <line x1="10" y1="336" x2="110" y2="336"/>
    <line x1="50" y1="372" x2="150" y2="372"/>
    <line x1="20" y1="408" x2="96" y2="408"/>
  </g>

  <!-- ===== Bicycle ===== -->
  <g id="bicycle">
    <use xlink:href="#wheel" href="#wheel" x="230" y="410"/>
    <use xlink:href="#wheel" href="#wheel" x="570" y="410"/>

    <!-- chainring + chain -->
    <circle cx="340" cy="398" r="19" fill="none" stroke="#6a6a6a" stroke-width="3"/>
    <circle cx="340" cy="398" r="11" fill="#3a3a3a"/>
    <g stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M 324 386 L 230 401"/>
      <path d="M 324 410 L 230 419"/>
    </g>
    <circle cx="230" cy="410" r="11" fill="#4a4a4a"/>

    <!-- frame -->
    <g fill="none" stroke="url(#frame)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 230 410 L 340 398"/>      <!-- chain stay -->
      <path d="M 300 326 L 340 398"/>      <!-- seat tube -->
      <path d="M 230 410 L 300 326"/>      <!-- seat stay -->
      <path d="M 340 398 L 500 328"/>      <!-- down tube -->
      <path d="M 300 326 L 500 328"/>      <!-- top tube -->
      <path d="M 500 328 L 514 362"/>      <!-- head tube -->
      <path d="M 514 362 L 570 410"/>      <!-- fork -->
    </g>

    <!-- saddle -->
    <path d="M 268 336 q -2 -14 14 -18 q 22 -6 48 -2 q 22 4 24 14 q -2 12 -26 14
             q -30 2 -48 -2 q -10 -2 -12 -6 Z"
          fill="#4b2c17" stroke="#33200f" stroke-width="2" stroke-linejoin="round"/>

    <!-- stem + handlebar -->
    <g fill="none" stroke="#2f2f2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 500 328 L 504 300"/>
      <path d="M 504 296 q 0 -14 16 -14 L 544 282 q 16 0 16 14 L 560 306"/>
    </g>
    <rect x="546" y="290" width="30" height="13" rx="6.5" fill="#1f1f1f"
          transform="rotate(-20 561 296.5)"/>
    <circle cx="504" cy="296" r="7" fill="#1f1f1f"/>

    <!-- bell -->
    <circle cx="530" cy="268" r="7.5" fill="#ffd34d" stroke="#c99a17" stroke-width="2"/>
    <rect x="527" y="259" width="6" height="5" rx="2" fill="#c99a17"/>

    <!-- crank arms + pedals -->
    <g stroke="#2f2f2f" stroke-width="7" stroke-linecap="round">
      <line x1="340" y1="398" x2="322" y2="374"/>
      <line x1="340" y1="398" x2="358" y2="424"/>
    </g>
    <rect x="304" y="369" width="36" height="10" rx="4" fill="#333" stroke="#1c1c1c" stroke-width="1.5"/>
    <rect x="340" y="419" width="36" height="10" rx="4" fill="#333" stroke="#1c1c1c" stroke-width="1.5"/>
  </g>

  <!-- ===== Pelican ===== -->
  <g id="pelican">
    <!-- tail feathers -->
    <g fill="#e9ecef" stroke="#cfd5da" stroke-width="1.5">
      <ellipse cx="278" cy="288" rx="48" ry="15" transform="rotate(-20,278,288)"/>
      <ellipse cx="282" cy="272" rx="40" ry="13" transform="rotate(-38,282,272)"/>
      <ellipse cx="276" cy="302" rx="40" ry="13" transform="rotate(-4,276,302)"/>
    </g>

    <!-- far wing (peeking over the near wing) -->
    <path d="M 380 236 C 428 214 484 226 522 250 C 530 256 526 266 516 264
             C 472 254 424 250 382 258 Z"
          fill="#dfe3e6" stroke="#c9cfd4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- far leg + foot -->
    <path d="M 332 292 L 310 332 L 324 366"
          fill="none" stroke="#e07b18" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <use xlink:href="#foot" href="#foot" transform="translate(324 370)" fill="#ef8a1c"/>

    <!-- body -->
    <ellipse cx="344" cy="258" rx="70" ry="54" fill="url(#plumage)" stroke="#cdd3d8" stroke-width="2"/>
    <path d="M 292 292 q 54 28 110 6" fill="none" stroke="#d8dde1" stroke-width="2"/>

    <!-- near leg + foot -->
    <path d="M 370 300 L 392 358 L 358 416"
          fill="none" stroke="#f59320" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <use xlink:href="#foot" href="#foot" transform="translate(358 420)" fill="#f59a24"/>

    <!-- neck -->
    <path d="M 386 256 C 402 218 424 188 450 166"
          fill="none" stroke="#d7dbdf" stroke-width="30" stroke-linecap="round"/>
    <path d="M 386 254 C 402 216 424 186 450 164"
          fill="none" stroke="#fdfdfe" stroke-width="24" stroke-linecap="round"/>

    <!-- head -->
    <ellipse cx="470" cy="146" rx="31" ry="27" fill="url(#plumage)" stroke="#cdd3d8" stroke-width="2"/>

    <!-- crest -->
    <g fill="#e4e8eb" stroke="#cfd5da" stroke-width="1.5" stroke-linejoin="round">
      <path d="M 452 128 C 444 116 446 106 452 100 C 456 110 458 120 460 130 Z"/>
      <path d="M 464 124 C 462 110 466 100 474 96 C 474 108 470 118 472 128 Z"/>
      <path d="M 476 128 C 480 116 488 110 496 110 C 492 120 486 128 484 136 Z"/>
    </g>

    <!-- eye -->
    <circle cx="481" cy="140" r="8.5" fill="#ffffff" stroke="#d5dade" stroke-width="1.5"/>
    <circle cx="482" cy="140" r="4.6" fill="#1d1d1d"/>
    <circle cx="483.6" cy="138.4" r="1.7" fill="#ffffff"/>

    <!-- upper mandible -->
    <path d="M 492 150 C 528 141 570 139 602 145 C 616 147 618 157 604 159
             C 566 163 524 163 492 160 Z"
          fill="url(#beakTop)" stroke="#cf7415" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 500 154 C 530 150 566 149 598 152" fill="none" stroke="#fff0d2"
          stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <ellipse cx="506" cy="152" rx="3.4" ry="1.8" fill="#c96a10"/>

    <!-- gular pouch -->
    <path d="M 492 158 C 522 170 554 184 586 197 C 600 202 606 211 601 217
             C 596 223 583 220 570 215 C 536 204 510 188 490 171 Z"
          fill="url(#pouch)" stroke="#cf7415" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 505 172 C 528 183 550 195 574 205" fill="none" stroke="#cf7415"
          stroke-width="1" opacity="0.45"/>
    <path d="M 512 168 C 534 178 556 190 580 200" fill="none" stroke="#cf7415"
          stroke-width="1" opacity="0.45"/>

    <!-- fish riding in the pouch -->
    <g transform="translate(556 202) rotate(16)">
      <path d="M 12 0 L 26 -9 L 26 9 Z" fill="#6fc3e8" stroke="#3f92bd" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="0" cy="0" rx="15" ry="7.5" fill="#8fd3f2" stroke="#3f92bd" stroke-width="1.5"/>
      <path d="M -4 -6 q 6 6 0 12" fill="#bde8fb" stroke="#3f92bd" stroke-width="1"/>
      <circle cx="-7" cy="-1.5" r="2" fill="#22414f"/>
    </g>

    <!-- near wing gripping the handlebar -->
    <path d="M 384 240 C 436 224 500 244 546 276 C 560 284 566 296 558 302
             C 552 306 544 300 536 296 C 488 282 434 268 384 268 Z"
          fill="url(#wing)" stroke="#c6ccd1" stroke-width="1.5" stroke-linejoin="round"/>
    <g fill="none" stroke="#ccd2d7" stroke-width="1.5" stroke-linecap="round">
      <path d="M 396 246 C 440 238 494 256 536 282"/>
      <path d="M 398 258 C 442 250 494 266 536 292"/>
    </g>

    <!-- wing tip / primaries curled over the grip -->
    <path d="M 536 278 C 552 282 564 292 564 300 C 560 306 550 304 540 298
             C 532 293 530 282 536 278 Z"
          fill="#dde2e6" stroke="#c6ccd1" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- ===== Foreground grass ===== -->
  <g stroke="#4f9d43" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 60 600 q 6 -22 16 -30"/>
    <path d="M 76 600 q 12 -20 24 -26"/>
    <path d="M 712 600 q -6 -22 -16 -30"/>
    <path d="M 728 600 q -12 -20 -24 -26"/>
  </g>
</svg>
