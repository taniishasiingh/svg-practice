<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="A pelican riding a cargo bicycle loaded with fish">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89cff0"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <g id="spoke">
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#bdbdbd" stroke-width="2"/>
    </g>
    <g id="cargoWheel">
      <circle r="42" fill="none" stroke="#37474f" stroke-width="9"/>
      <circle r="34" fill="none" stroke="#cfd8dc" stroke-width="3"/>
      <use xlink:href="#spoke" href="#spoke"/>
      <use xlink:href="#spoke" href="#spoke" transform="rotate(45)"/>
      <use xlink:href="#spoke" href="#spoke" transform="rotate(90)"/>
      <use xlink:href="#spoke" href="#spoke" transform="rotate(135)"/>
      <circle r="7" fill="#37474f"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="100" r="50" fill="#fff9c4" opacity="0.95"/>
  <g stroke="#fff9c4" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="680" y1="20" x2="680" y2="8"/>
    <line x1="680" y1="180" x2="680" y2="192"/>
    <line x1="600" y1="100" x2="588" y2="100"/>
    <line x1="760" y1="100" x2="772" y2="100"/>
    <line x1="612" y1="42" x2="604" y2="34"/>
    <line x1="748" y1="158" x2="756" y2="166"/>
    <line x1="748" y1="42" x2="756" y2="34"/>
    <line x1="612" y1="158" x2="604" y2="166"/>
  </g>

  <!-- Clouds -->
  <g fill="#fff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="55" ry="28"/>
    <ellipse cx="185" cy="80" rx="45" ry="22"/>
    <ellipse cx="110" cy="80" rx="38" ry="20"/>
    <ellipse cx="480" cy="130" rx="50" ry="25"/>
    <ellipse cx="520" cy="120" rx="42" ry="20"/>
    <ellipse cx="450" cy="120" rx="36" ry="18"/>
  </g>

  <!-- Ground -->
  <rect y="480" width="800" height="120" fill="url(#grass)"/>
  <rect y="480" width="800" height="10" fill="#4caf50"/>

  <!-- Road -->
  <rect x="0" y="500" width="800" height="50" fill="#455a64"/>
  <line x1="0" y1="525" x2="800" y2="525" stroke="#fff" stroke-width="4" stroke-dasharray="30,20" opacity="0.8"/>

  <!-- Cargo bike -->
  <g id="cargoBike">
    <!-- Front small wheel -->
    <use xlink:href="#cargoWheel" href="#cargoWheel" x="180" y="458"/>

    <!-- Rear large wheel -->
    <use xlink:href="#cargoWheel" href="#cargoWheel" x="580" y="458"/>

    <!-- Cargo box frame (between wheels) -->
    <g fill="none" stroke="#37474f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main cargo frame -->
      <path d="M 210 458 L 210 370 L 550 370 L 550 458"/>
      <!-- Box sides -->
      <path d="M 220 370 L 220 300 L 540 300 L 540 370"/>
      <!-- Front vertical -->
      <path d="M 210 370 L 210 300"/>
      <!-- Rear vertical -->
      <path d="M 550 370 L 550 300"/>
    </g>

    <!-- Cargo box fill -->
    <rect x="222" y="302" width="316" height="66" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="2" rx="4"/>
    <rect x="224" y="304" width="312" height="62" fill="#f5f5f5" rx="3"/>

    <!-- Fish in cargo box -->
    <g fill="#4fc3f7" stroke="#29b6f6" stroke-width="1.5">
      <g transform="translate(260 335) rotate(-10)">
        <ellipse rx="16" ry="7" fill="#4fc3f7" stroke="#29b6f6"/>
        <path d="M 16 0 L 24 -6 L 24 6 Z" fill="#4fc3f7" stroke="#29b6f6"/>
        <circle cx="-4" cy="-1" r="2" fill="#37474f"/>
      </g>
      <g transform="translate(310 328) rotate(5)">
        <ellipse rx="14" ry="6" fill="#81d4fa" stroke="#4fc3f7"/>
        <path d="M 14 0 L 22 -5 L 22 5 Z" fill="#81d4fa" stroke="#4fc3f7"/>
        <circle cx="-3" cy="-1" r="1.5" fill="#37474f"/>
      </g>
      <g transform="translate(370 332) rotate(-8)">
        <ellipse rx="15" ry="7" fill="#4fc3f7" stroke="#29b6f6"/>
        <path d="M 15 0 L 23 -6 L 23 6 Z" fill="#4fc3f7" stroke="#29b6f6"/>
        <circle cx="-4" cy="-1" r="2" fill="#37474f"/>
      </g>
      <g transform="translate(420 335) rotate(12)">
        <ellipse rx="13" ry="6" fill="#81d4fa" stroke="#4fc3f7"/>
        <path d="M 13 0 L 21 -5 L 21 5 Z" fill="#81d4fa" stroke="#4fc3f7"/>
        <circle cx="-3" cy="-1" r="1.5" fill="#37474f"/>
      </g>
      <g transform="translate(470 330) rotate(-5)">
        <ellipse rx="14" ry="6" fill="#4fc3f7" stroke="#29b6f6"/>
        <path d="M 14 0 L 22 -5 L 22 5 Z" fill="#4fc3f7" stroke="#29b6f6"/>
        <circle cx="-3" cy="-1" r="1.5" fill="#37474f"/>
      </g>
      <g transform="translate(520 328) rotate(3)">
        <ellipse rx="12" ry="5" fill="#81d4fa" stroke="#4fc3f7"/>
        <path d="M 12 0 L 20 -4 L 20 4 Z" fill="#81d4fa" stroke="#4fc3f7"/>
        <circle cx="-2" cy="-1" r="1.5" fill="#37474f"/>
      </g>
    </g>

    <!-- Frame connecting wheels to cargo -->
    <g fill="none" stroke="#37474f" stroke-width="7" stroke-linecap="round">
      <path d="M 180 458 L 210 370"/>
      <path d="M 580 458 L 550 370"/>
      <path d="M 180 458 L 180 410 L 210 370"/>
      <path d="M 580 458 L 580 410 L 550 370"/>
    </g>

    <!-- Handlebars from front wheel -->
    <g fill="none" stroke="#37474f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 180 410 L 180 350 Q 180 330 200 330 L 240 330 Q 255 330 255 340 L 255 350"/>
    </g>
    <circle cx="255" cy="350" r="8" fill="#263238"/>
    <circle cx="200" cy="330" r="7" fill="#263238"/>

    <!-- Bell -->
    <circle cx="220" cy="320" r="6" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>

    <!-- Front crank/pedals -->
    <circle cx="180" cy="458" r="14" fill="none" stroke="#546e7a" stroke-width="3"/>
    <circle cx="180" cy="458" r="5" fill="#546e7a"/>
    <line x1="180" y1="458" x2="180" y2="478" stroke="#546e7a" stroke-width="4" stroke-linecap="round"/>
    <rect x="165" y="476" width="30" height="8" rx="3" fill="#546e7a"/>
    <line x1="180" y1="458" x2="180" y2="438" stroke="#546e7a" stroke-width="4" stroke-linecap="round"/>
    <rect x="165" y="428" width="30" height="8" rx="3" fill="#546e7a"/>

    <!-- Rear chainring -->
    <circle cx="580" cy="458" r="16" fill="none" stroke="#546e7a" stroke-width="3"/>
    <circle cx="580" cy="458" r="6" fill="#546e7a"/>
    <path d="M 564 444 L 580 442 M 564 472 L 580 474" fill="none" stroke="#546e7a" stroke-width="2"/>
  </g>

  <!-- Pelican rider -->
  <g id="pelican">
    <!-- Tail feathers -->
    <g fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1.5">
      <ellipse cx="270" cy="290" rx="38" ry="13" transform="rotate(-20, 270, 290)"/>
      <ellipse cx="265" cy="278" rx="32" ry="11" transform="rotate(-32, 265, 278)"/>
      <ellipse cx="275" cy="302" rx="30" ry="11" transform="rotate(-8, 275, 302)"/>
    </g>

    <!-- Body -->
    <ellipse cx="360" cy="270" rx="64" ry="48" fill="#fff" stroke="#e0e0e0" stroke-width="2"/>

    <!-- Wing on handlebar -->
    <path d="M 380 255 Q 420 240 460 250 Q 480 255 485 262 Q 480 270 440 270 Q 400 270 380 260 Z"
          fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>

    <!-- Legs -->
    <g stroke="#ff9800" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M 340 305 Q 330 340 320 370 Q 315 390 320 415"/>
      <path d="M 370 310 Q 360 345 350 370 Q 340 395 320 415"/>
    </g>

    <!-- Feet on pedals -->
    <g fill="#ff9800">
      <ellipse cx="320" cy="422" rx="11" ry="5"/>
      <ellipse cx="320" cy="470" rx="11" ry="5"/>
    </g>

    <!-- Neck -->
    <path d="M 400 250 Q 420 210 440 180 Q 450 165 458 158"
          fill="none" stroke="#f5f5f5" stroke-width="26" stroke-linecap="round"/>
    <path d="M 400 250 Q 420 210 440 180 Q 450 165 458 158"
          fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="465" cy="150" rx="28" ry="23" fill="#fff" stroke="#e0e0e0" stroke-width="2"/>

    <!-- Crest -->
    <path d="M 450 130 Q 445 115 450 105 Q 455 115 455 130" fill="#e8e8e8"/>
    <path d="M 460 128 Q 458 110 465 100 Q 468 113 465 128" fill="#e8e8e8"/>
    <path d="M 470 128 Q 472 112 480 105 Q 480 115 475 128" fill="#e8e8e8"/>

    <!-- Eye -->
    <circle cx="475" cy="142" r="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <circle cx="476" cy="142" r="3.5" fill="#222"/>
    <circle cx="477" cy="141" r="1.2" fill="#fff"/>

    <!-- Upper mandible -->
    <path d="M 488 140 Q 535 135 585 145 Q 595 147 590 152 Q 535 160 488 155 Z"
          fill="#ffb74d" stroke="#e65100" stroke-width="1.5"/>

    <!-- Lower mandible + pouch -->
    <path d="M 488 155 Q 515 158 545 172 Q 565 185 578 200 Q 582 208 572 210
             Q 555 205 535 195 Q 505 185 488 160 Z"
          fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>

    <!-- Pouch detail -->
    <path d="M 500 162 Q 525 172 550 185" fill="none" stroke="#e65100" stroke-width="0.8" opacity="0.5"/>
    <path d="M 510 158 Q 530 168 555 180" fill="none" stroke="#e65100" stroke-width="0.8" opacity="0.5"/>

    <!-- Nostril -->
    <ellipse cx="500" cy="145" rx="3" ry="1.5" fill="#cc7700"/>

    <!-- Small fish in pouch -->
    <g transform="translate(540 185) rotate(10)">
      <ellipse rx="10" ry="4" fill="#4fc3f7" stroke="#29b6f6" stroke-width="1"/>
      <path d="M 10 0 L 16 -4 L 16 4 Z" fill="#4fc3f7" stroke="#29b6f6" stroke-width="1"/>
      <circle cx="-4" cy="-1" r="1.2" fill="#37474f"/>
    </g>
  </g>

  <!-- Motion lines -->
  <g stroke="#90a4ae" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <path d="M 80 380 Q 90 400 80 420" fill="none"/>
    <path d="M 60 410 Q 70 425 60 440" fill="none"/>
    <path d="M 700 380 Q 690 400 700 420" fill="none"/>
    <path d="M 720 410 Q 710 425 720 440" fill="none"/>
  </g>
</svg>